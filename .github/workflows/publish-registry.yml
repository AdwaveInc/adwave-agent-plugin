name: Publish to the MCP Registry

# Publishes server.json as com.adwave/adwave. A DNS TXT record on adwave.com
# proves the namespace; MCP_REGISTRY_DNS_KEY is the private half of its key.
# Bump "version" in every manifest (scripts/validate.mjs checks they agree)
# before cutting a release.
on:
  release:
    types: [published]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: node scripts/validate.mjs
      - name: Install mcp-publisher
        run: curl -fsSL "https://github.com/modelcontextprotocol/registry/releases/download/v1.8.6/mcp-publisher_linux_amd64.tar.gz" | tar xz mcp-publisher
      - run: ./mcp-publisher validate server.json
      - run: ./mcp-publisher login dns --domain adwave.com --private-key "$MCP_REGISTRY_DNS_KEY"
        env:
          MCP_REGISTRY_DNS_KEY: ${{ secrets.MCP_REGISTRY_DNS_KEY }}
      - run: ./mcp-publisher publish
